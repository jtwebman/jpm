name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Linux x64 and Windows x64 for now. The ARM jobs (a native arm64 runner, and armv7 under
    # qemu for 32-bit Raspberry Pi OS) come back once Linux, macOS and Windows are stable: the
    # armv7 one took about 45 minutes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history on Linux, for the commit-message check below.
          fetch-depth: ${{ matrix.os == 'ubuntu-latest' && 0 || 1 }}
      # Commits carry no AI co-author trailers.
      - if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        run: |
          range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
          if git log --format=%B "$range" | grep -Eiq '^co-authored-by:.*(claude|anthropic)'; then
            echo "a commit in this PR has a Co-Authored-By trailer for Claude; remove it"; exit 1
          fi
      # Installs the version rust-toolchain.toml pins.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # No macOS runner yet: at least compile and lint for both Macs, so a release build
      # there does not break unseen. Tests are left out: their dev-dependencies need a
      # macOS C toolchain.
      - if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo clippy --workspace --target aarch64-apple-darwin -- -D warnings
          cargo clippy --workspace --target x86_64-apple-darwin -- -D warnings
