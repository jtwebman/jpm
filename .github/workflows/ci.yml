name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Linux x64, Windows x64 and macOS arm64. The Linux ARM jobs (a native arm64 runner, and
    # armv7 under qemu for 32-bit Raspberry Pi OS) come back once all three are stable: the
    # armv7 one took about 45 minutes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history on Linux, for the commit-message check below.
          fetch-depth: ${{ matrix.os == 'ubuntu-latest' && 0 || 1 }}
      # Commits carry no AI co-author trailers.
      - if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        run: |
          range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
          if git log --format=%B "$range" | grep -Eiq '^co-authored-by:.*(claude|anthropic)'; then
            echo "a commit in this PR has a Co-Authored-By trailer for Claude; remove it"; exit 1
          fi
      # Installs the version rust-toolchain.toml pins.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # No Intel Mac runner: at least compile and lint for it.
      - if: matrix.os == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin
          cargo clippy --workspace --target x86_64-apple-darwin -- -D warnings

  # pnpm's registry-mock: its edge-case packages installed with jpm and compared with what pnpm
  # 12 installs (tests/conformance/pnpm-registry-mock/expected.json, recorded on Linux x64).
  registry-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: cargo build --release
      - run: bash tests/conformance/pnpm-registry-mock/registry.sh "$RUNNER_TEMP/regmock"
      - run: node tests/conformance/pnpm-registry-mock/diff.mjs
      - if: failure()
        run: tail -50 "$RUNNER_TEMP/regmock/registry.log" || true
