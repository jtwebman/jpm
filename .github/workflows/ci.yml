name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Linux x64 and Windows x64 for now. The ARM jobs (a native arm64 runner, and armv7 under
    # qemu for 32-bit Raspberry Pi OS) come back once Linux, macOS and Windows are stable: the
    # armv7 one took about 45 minutes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Installs the version rust-toolchain.toml pins.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
