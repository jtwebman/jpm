name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: jpm-linux-x64, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: jpm-linux-arm64, musl: true }
          - { os: macos-13, target: x86_64-apple-darwin, asset: jpm-darwin-x64 }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: jpm-darwin-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: jpm-windows-x64.exe }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, asset: jpm-windows-arm64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/jpm
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum jpm-* > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/* install.sh install.ps1 --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
