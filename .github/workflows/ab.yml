name: ab

# Throwaway: A/B timing of two refs on one ubuntu-latest runner (bench/ab.env). Pushes to perf-ab only.
on:
  push:
    branches: [perf-ab]

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y time
      - run: rustup show active-toolchain || rustup toolchain install
      - name: build
        run: |
          source bench/ab.env
          for v in $REFS; do
            tag=${v%%=*} ref=${v#*=}
            git worktree add --detach ../build-$tag $ref
            (cd ../build-$tag && CARGO_TARGET_DIR=$PWD/../target-$tag cargo build --release 2>&1 | tail -1)
            echo "$tag=$ref $(git rev-parse --short $ref) $(stat -c %s ../target-$tag/release/jpm) bytes"
          done | tee sizes.txt
      - name: ab
        run: |
          source bench/ab.env
          bins=(); for v in $REFS; do tag=${v%%=*}; bins+=("$tag=$PWD/../target-$tag/release/jpm"); done
          bash bench/ab.sh $N $PHASES $FIXTURES "${bins[@]}" | tee ab.out
          { echo "## A/B on ubuntu-latest ($(nproc) cores)"; echo; sed 's/$/  /' sizes.txt; echo; grep '^|' ab.out; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab
          path: |
            ab.out
            sizes.txt
