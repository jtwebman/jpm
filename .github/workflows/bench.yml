name: bench

# bench/bench.sh on the runner most CI pays for, started by hand: the latest release of every
# manager against jpm built from the chosen ref. The tables go to the run's summary.
on:
  workflow_dispatch:
    inputs:
      runners:
        description: package managers (comma-separated)
        default: jpm,npm,pnpm,bun,yarn,deno,aube,upm
      fixtures:
        description: fixtures (comma-separated)
        default: nitro,nuxt,next
      samples:
        description: runs per phase
        default: "3"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GNU time for the timings; Node for npm, yarn and upm.
      - run: sudo apt-get install -y time
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: bench
        env:
          BENCH_WORK: ${{ runner.temp }}/bench
        run: |
          bench/bench.sh -r "${{ inputs.runners }}" -f "${{ inputs.fixtures }}" -n "${{ inputs.samples }}" | tee bench.out
          results=$(ls -t bench/results/*.tsv | head -n 1)
          {
            echo "## jpm bench on ubuntu-latest ($(nproc) cores, $(git rev-parse --short HEAD))"
            echo
            bench/bench.sh --report "$results"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-results
          path: |
            bench/results/*.tsv
            bench.out
