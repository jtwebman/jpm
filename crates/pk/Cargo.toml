[package]
name = "jpm-pk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The public-key cryptography jpm's TLS handshakes need: X25519, P-256, P-384 and RSA"
rust-version = "1.89"
publish = false

[dependencies]
jpm-crypto = { path = "../crypto" }

[dev-dependencies]
# Test vectors ship gzipped; ring is the reference the differential tests compare against.
flate2 = "1.1.10"
ring = "0.17.14"
serde_json = "1"
