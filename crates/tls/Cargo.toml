[package]
name = "jpm-tls"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small TLS 1.3 and 1.2 client with Web PKI certificate checks, for jpm"
rust-version = "1.89"
publish = false

[dependencies]
jpm-crypto = { path = "../crypto" }

[dev-dependencies]
# The reference server, and certificates for it, in interop tests; neither ships in jpm.
flate2 = "1.1.10"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
# The reference path validator for differential certificate tests.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std", "ring"] }
serde_json = "1"
webpki-roots = "1"
