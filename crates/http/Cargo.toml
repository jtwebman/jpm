[package]
name = "jpm-http"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The HTTP client jpm fetches registries with: HTTP/2 over jpm-tls, for GET requests"
rust-version = "1.89"
publish = false

[dependencies]
jpm-tls = { path = "../tls" }

[dev-dependencies]
# The TLS server, and a certificate for it, in the end-to-end tests; neither ships in jpm.
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
# Mozilla's roots, for the live test against the npm registry.
webpki-roots = "1"
