[package]
name = "jpm"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "A fast, small package manager for the npm registry"
rust-version = "1.89"

[workspace]
members = ["crates/*"]

[dependencies]
jpm-crypto = { path = "crates/crypto" }
jpm-pk = { path = "crates/pk" }
jpm-tls = { path = "crates/tls" }
# runtime_detection: zlib-rs checks the CPU at run time and inflates with AVX2 and folds the gzip
# CRC with PCLMULQDQ where it can; without it every machine gets the plain x86-64 code.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
webpki-roots = "1"

[dev-dependencies]
# Only the tests build JSON with its `json!` macro; the binary uses src/json.rs.
serde_json = { version = "1", features = ["preserve_order"] }
# A registry over TLS with a private CA, for the certificate settings' tests.
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target."cfg(windows)".dependencies]
junction = "2.1.0"

# Built for size: jpm waits on the network and the disk far more than on the CPU. The crates
# that do the CPU work (inflate, TLS records) keep full speed.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Hashing and AES sit on the download path: full speed there, size everywhere else.
[profile.release.package.jpm-crypto]
opt-level = 3

# The handshake's public-key math runs a few times per connection: "s" is smaller than "z" for
# it and twice as fast on RSA (measured: 1,601,584 against 1,602,632 bytes).
[profile.release.package.jpm-pk]
opt-level = "s"

[profile.release.package.zlib-rs]
opt-level = 3

# Everything at full speed, for comparing: `cargo build --profile fast`.
[profile.fast]
inherits = "release"
opt-level = 3
