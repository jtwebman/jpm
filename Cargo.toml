[package]
name = "jpm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A fast, small package manager for the npm registry"
rust-version = "1.88"

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "raw_value"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target."cfg(windows)".dependencies]
junction = "2.1.0"

# Built for size: jpm waits on the network and the disk far more than on the CPU. The crates
# that do the CPU work (inflate, JSON, TLS records) keep full speed.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.zlib-rs]
opt-level = 3

[profile.release.package.serde_json]
opt-level = 3

[profile.release.package.rustls]
opt-level = 3

# Everything at full speed, for comparing: `cargo build --profile fast`.
[profile.fast]
inherits = "release"
opt-level = 3
