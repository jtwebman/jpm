[package]
name = "jpm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A fast, small package manager for the npm registry"
rust-version = "1.88"

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
ring = "0.17.14"
# No logging; src/http.rs picks the suites. TLS 1.2 stays: registry.npmjs.org does not speak 1.3.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
# Only the tests build JSON with its `json!` macro; the binary uses src/json.rs.
serde_json = { version = "1", features = ["preserve_order"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target."cfg(windows)".dependencies]
junction = "2.1.0"

# Built for size: jpm waits on the network and the disk far more than on the CPU. The crates
# that do the CPU work (inflate, TLS records) keep full speed.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.zlib-rs]
opt-level = 3

[profile.release.package.rustls]
opt-level = 3

# Everything at full speed, for comparing: `cargo build --profile fast`.
[profile.fast]
inherits = "release"
opt-level = 3
